                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="main.html"><span>Home</span></a>

    <!-- Profile Section -->
    <div class="container mt-5">
        <div class="profile-container">
            <h2 class="text-center mb-4">User Profile</h2>
            <div id="user-details">
                <!-- User details will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Footer -->

    <!-- Firebase and App Scripts -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5iAUnK_5AP7ijrcQvlRfvCSfXrH9n6Ak",
            authDomain: "index-16f53.firebaseapp.com",
            projectId: "index-16f53",
            storageBucket: "index-16f53.firebasestorage.app",
            messagingSenderId: "171804052014",
            appId: "1:171804052014:web:c38d9d50835d551cafadbf"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Function to display user details
        const displayUserDetails = (user) => {
            const userDetailsContainer = document.getElementById("user-details");
            userDetailsContainer.innerHTML = `
                <p><strong>Username:</strong> ${user.username}</p>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Password:</strong> ${user.password}</p>
            `;
        };

        // Fetch user details from Firebase
        const fetchUserDetails = async (userId) => {
            try {
                const userRef = ref(database, `users/${userId}`);
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    displayUserDetails(userData);
                } else {
                    console.error("User data not found in Firebase.");
                }
            } catch (error) {
                console.error("Error fetching user details:", error);
            }
        };

        // Logout functionality
        const logoutButton = document.getElementById("Logout");
    if (logoutButton) {
        logoutButton.addEventListener("click", async () => {
            try {
                // Sign out the user
                await signOut(auth);
                console.log("User signed out successfully.");

                // Redirect to index.html
                window.location.href = "index.html";
            } catch (error) {
                console.error("Error logging out:", error);
                alert("An error occurred while logging out. Please try again.");
            }
        });
    }

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const userId = user.uid;
                fetchUserDetails(userId);
            } else {
                window.location.href = "index.html"; // Redirect to login page if not authenticated
            }
        });
        
    </script>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
