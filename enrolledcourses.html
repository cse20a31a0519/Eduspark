<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        /* Ensure the footer sticks to the bottom */
        html, body {
            height: 100%;
            margin: 0;
        }
        .wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
        }
        .footer {
            background-color: #2563EB; /* Blue background */
            color: white; /* White text */
            padding: 10px 0;
            text-align: center;
            margin-top: auto; /* Push footer to the bottom */
        }
        /* Card Styles */
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px); /* Slightly lift the card */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* Increase shadow on hover */
        }

        .card-body {
            padding: 10px;
        }

        .card-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-text {
            text-align: center;
            text-align: left;
            font-size: 1rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2563EB;">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#" style="font-weight: bold;">
                    <i class="fas fa-graduation-cap mr-2"></i> EduSpark
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="main.html"><span>Home</span></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="userProfile.html"><span>User Profile</span></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="enrolledcourses.html"><span>My Courses</span></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="payment.html"><span>Payments</span></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="certificates.html"><span>Certificates</span></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="Saved.html"><span>Saved Videos</span></a>

                    </ul>
                    <div class="auth-buttons d-flex">
                        <button id="Logout" class="btn btn-light">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="content container mt-5">
            <h2>Enrolled Courses</h2>
            <div id="courses-list" class="row"></div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>&copy; 2023 EduSpark. All rights reserved.</p>
            </div>
        </footer>

    <!-- Firebase Script -->
    <script type="module">
      // Import Firebase functions
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
      import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyB5iAUnK_5AP7ijrcQvlRfvCSfXrH9n6Ak",
        authDomain: "index-16f53.firebaseapp.com",
        projectId: "index-16f53",
        storageBucket: "index-16f53.firebasestorage.app",
        messagingSenderId: "171804052014",
        appId: "1:171804052014:web:c38d9d50835d551cafadbf",
        databaseURL: "https://index-16f53-default-rtdb.firebaseio.com/"
      };
  

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const database = getDatabase(app);

      // Check authentication state
      onAuthStateChanged(auth, (user) => {
        if (user) {
          console.log("User is logged in:", user.uid); // Debugging: Log user UID
          // Fetch user data (including username) and enrolled courses
          fetchUserData(user.uid);
        } else {
          console.log("User is not logged in"); // Debugging: Log when user is not logged in
          // User is not logged in, redirect to login page
          window.location.href = "login.html";
        }
      });

      // Fetch user data and enrolled courses
      function fetchUserData(userId) {
        const userRef = ref(database, `users/${userId}`);
        onValue(userRef, (snapshot) => {
          const userData = snapshot.val();
          console.log("User Data:", userData); // Debugging: Log user data to console

          if (userData) {
            const username = userData.username;
            const enrolledCourses = userData.enrolledCourses;

            // Display username
            // document.getElementById('courses-list').innerHTML = `<h3>Welcome, ${username}!</h3>`;

            // Display enrolled courses
            if (enrolledCourses && Array.isArray(enrolledCourses)) {
              console.log("Enrolled Courses:", enrolledCourses); // Debugging: Log enrolled courses
              enrolledCourses.forEach((course, index) => {
                const courseCard = `
                  <div class="col-md-4 mb-4">
                    <div class="card">
                      <div class="card-body">
                        <h5 class="card-title">${course.title}</h5>
                        <p class="card-text">Category: ${course.category}</p>
                        <p class="card-text">Price: ${course.price}</p>
                        <p class="card-text"><small class="text-muted">Enrolled on: ${new Date(course.enrolledOn).toLocaleDateString()}</small></p>
                      </div>
                    </div>
                  </div>
                `;
                document.getElementById('courses-list').innerHTML += courseCard;
              });
            } else {
              console.log("No courses enrolled or invalid format"); // Debugging: Log when no courses are enrolled
              document.getElementById('courses-list').innerHTML += '<p>No courses enrolled.</p>';
            }
          } else {
            console.log("User data not found"); // Debugging: Log when user data is not found
            document.getElementById('courses-list').innerHTML = '<p>User data not found.</p>';
          }
        });
      }

      // Logout functionality
      document.getElementById('Logout').addEventListener('click', () => {
        signOut(auth).then(() => {
          console.log("User logged out successfully"); // Debugging: Log successful logout
          window.location.href = "login.html";
        }).catch((error) => {
          console.error("Logout error:", error); // Debugging: Log logout error
        });
      });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
