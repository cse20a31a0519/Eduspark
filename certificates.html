    <!-- Firebase Script -->
    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5iAUnK_5AP7ijrcQvlRfvCSfXrH9n6Ak",
            authDomain: "index-16f53.firebaseapp.com",
            projectId: "index-16f53",
            storageBucket: "index-16f53.firebasestorage.app",
            messagingSenderId: "171804052014",
            appId: "1:171804052014:web:c38d9d50835d551cafadbf",
            databaseURL: "https://index-16f53-default-rtdb.firebaseio.com/"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User is logged in:", user.uid);
                fetchCertificates(user.uid);
            } else {
                console.log("User is not logged in");
                window.location.href = "login.html";
            }
        });

        // Fetch certificates
        function fetchCertificates(userId) {
            const certificatesRef = ref(database, `users/${userId}/certificates`);

            onValue(certificatesRef, (snapshot) => {
                const certificatesData = snapshot.val();
                console.log("Certificates Data:", certificatesData);

                const certificatesList = document.getElementById('certificates-list');
                certificatesList.innerHTML = '';

                if (certificatesData) {
                    const uniqueCertificates = {};

                    // Filter duplicates
                    Object.keys(certificatesData).forEach((key) => {
                        const certificate = certificatesData[key];

                        // Ensure certificate has both courseTitle and studentName
                        if (certificate.courseTitle && certificate.studentName) {
                            const uniqueKey = `${certificate.courseTitle}-${certificate.studentName}`;

                            // Only add the certificate if it doesn't already exist
                            if (!uniqueCertificates[uniqueKey]) {
                                uniqueCertificates[uniqueKey] = certificate;
                            }
                        }
                    });

                    // Display unique certificates
                    Object.values(uniqueCertificates).forEach((certificate) => {
                        const issueDate = certificate.timestamp ? new Date(certificate.timestamp).toLocaleDateString() : "Unknown date";

                        const certificateCard = document.createElement("div");
                        certificateCard.classList.add("card");
                        certificateCard.innerHTML = `
                            <div class="card-body">
                                <h5 class="card-title">${certificate.courseTitle}</h5>
                                <p class="card-text">Issued To: ${certificate.studentName}</p>
                                <p class="card-text">Issued On: ${issueDate}</p>
                              
                                <button class="btn btn-primary btn-view-certificate" onclick="viewCertificate('${certificate.courseTitle}', '${certificate.studentName}')">View Certificate</button>
                            </div>
                        `;

                        certificatesList.appendChild(certificateCard);
                    });
                } else {
                    certificatesList.innerHTML = '<p>No certificates found.</p>';
                }
            }, (error) => {
                console.error("Error fetching certificates:", error);
            });
        }

        // Logout functionality
        document.getElementById('Logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                console.log("User logged out successfully");
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("Logout error:", error);
            });
        });
    </script>

    <!-- Define viewCertificate in global scope -->
    <script>
        // View Certificate
        function viewCertificate(courseTitle, studentName) {
            window.location.href = `certificate.html?courseName=${encodeURIComponent(courseTitle)}&studentName=${encodeURIComponent(studentName)}`;
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
