<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Tailwind CSS for Gradient -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .container {
            margin-top: 80px; /* Adjusted for fixed navbar */
        }
        .video-item {
            margin-bottom: 10px;
        }
        .video-player {
            margin-top: 20px;
        }
        iframe, video {
            width: 100%;
            height: 600px; /* Increased height */
        }
        .progress {
            margin-top: 20px;
            height: 30px;
        }
        .progress-bar {
            transition: width 0.5s ease;
        }
        #generate-certificate {
            margin-top: 20px;
        }
        /* Navbar and Footer Height */
        .navbar {
            height: 60px; /* Reduced height */
        }
        .footer {
            height: 60px; /* Reduced height */
        }
        .btn-back {
            background-color: #ffc107; /* Yellow color */
            color: white;
        }
        .course-title {
            text-align: center; /* Center the course title */
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-blue-600">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#">
                <i class="fas fa-graduation-cap mr-2"></i>
                <span>EduSpark</span>
            </a>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="container">
        <h1 class="course-title" style="font-size: 2rem; font-weight: bolder;" id="course-title"></h1>
        <div id="video-player" class="video-player"></div>
        <div class="progress">
            <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>
        <button id="generate-certificate" class="btn btn-success mb-2" disabled>Generate Certificate</button>
        <div id="video-list" class="list-group"></div>
    </div>

    <!-- Footer -->
    <footer class="bg-blue-600 text-white text-center p-4 mt-8">
        <p>&copy; 2023 EduSpark. All rights reserved.</p>
    </footer>

    <!-- SweetAlert JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="ex.js"></script>
</body>
</html>
